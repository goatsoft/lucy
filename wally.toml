[package]
name = "goatsoft/lucy"
description = "Lucy: a UI and app framework for Roblox, built on Universal Styling"
version = "0.1.0"
license = "MIT"
authors = ["GOATsoft"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
# Only the Luau package ships (ADR 0012). Wally 0.3 ignores `include`, so this is an
# exclude list; CI fails if the package holds anything beyond src/, default.project.json,
# wally.toml, README.md and LICENSE. Add new top-level folders and files here.
exclude = [
	"**/*.spec.luau",
	"src/Testing",
	"apps",
	"assets",
	"libs",
	"types",
	"tsconfig.base.json",
	"vite.library.ts",
	".nvmrc",
	"docs",
	"LICENSE-ART.md",
	"scripts",
	"tests",
	"examples",
	"node_modules",
	"package.json",
	"pnpm-workspace.yaml",
	"pnpm-lock.yaml",
	"registry.json",
	"AGENTS.md",
	"rokit.toml",
	"selene.toml",
	"stylua.toml",
	"testez.yml",
	"test.project.json",
	"sourcemap.json",
	"DevPackages",
	"Packages",
	"plugins",
	".claude-plugin",
	".agents",
]

[dependencies]

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"
